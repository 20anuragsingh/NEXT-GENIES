<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="192x192" href="/ng-logo-192.png" />
    <link rel="icon" type="image/png" sizes="any" href="/ng-logo-transparent.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/ng-logo-192.png" />

    <meta name="theme-color" content="#edf1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15181f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- seo:start (replaced per page by scripts/generate-seo.mjs during `npm run build`) -->
    <title>NextGenies | Digital Growth Agency — Content, Websites &amp; Scaling</title>
    <meta name="description" content="NextGenies is a digital growth agency helping ambitious brands scale with high-impact content creation, conversion-focused websites, branding, and social media." />
    <link rel="canonical" href="https://nextgenies.com/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NextGenies" />
    <meta property="og:url" content="https://nextgenies.com/" />
    <meta property="og:title" content="NextGenies | Digital Growth Agency — Content, Websites &amp; Scaling" />
    <meta property="og:description" content="NextGenies is a digital growth agency helping ambitious brands scale with high-impact content creation, conversion-focused websites, branding, and social media." />
    <meta property="og:image" content="https://nextgenies.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NextGenies | Digital Growth Agency — Content, Websites &amp; Scaling" />
    <meta name="twitter:description" content="NextGenies is a digital growth agency helping ambitious brands scale with high-impact content creation, conversion-focused websites, branding, and social media." />
    <meta name="twitter:image" content="https://nextgenies.com/og-image.png" />
    <script type="application/ld+json" id="ld-page">{"@context":"https://schema.org","@type":"Organization","name":"NextGenies","url":"https://nextgenies.com","logo":"https://nextgenies.com/ng-logo-transparent.png"}</script>
    <!-- seo:end -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Apply the saved theme before first paint (prevents a light/dark flash) -->
    <script>
      try { var t = localStorage.getItem("ng-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>

    <!-- Google tag (gtag.js) — included once -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ESMZV18S3V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-ESMZV18S3V');
    </script>
  </head>
  <body>
    <div id="root"><!--app-fallback--></div>

</html>
